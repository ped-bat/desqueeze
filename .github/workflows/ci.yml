name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dnglab is downloaded from its official GitHub release on every
      # platform. dcraw_emu comes from the LibRaw Win64 zip on Windows,
      # and from the system package (then made self-contained) elsewhere.
      - name: Install LibRaw (macOS)
        if: runner.os == 'macOS'
        run: brew install libraw

      # Ubuntu's libraw-bin is 0.21.x and rejects newer camera raws (e.g.
      # Sony "Lossless Compressed RAW 2"). Build from source so Linux ships
      # the same LibRaw version as macOS and Windows.
      - name: Build LibRaw from source (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-libraw-linux.sh

      - name: Acquire bundled binaries
        run: node scripts/setup-binaries.js

      # dnglab.exe/dcraw_emu.exe link against the VC++ runtime, which is not
      # part of Windows. Runners have it preinstalled, so this only shows up
      # on end-user machines (exit 0xC0000135, no stderr).
      - name: Bundle MSVC runtime (Windows)
        if: runner.os == 'Windows'
        run: node scripts/bundle-msvc-runtime.js

      - name: Run tests (unit, integration, e2e with real binaries)
        run: npm test

      - name: Build app bundle
        run: npx electron-vite build

      - name: Package installer
        env:
          # CI builds are unsigned; release signing/notarization happens
          # locally (or in a release workflow with certificate secrets)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Copy extraResources instead of hardlinking so signing never
          # rewrites the checked-in binaries in resources/bin/
          USE_HARD_LINKS: "false"
        run: npx electron-builder --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: desqueeze-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
