name: Deploy landing site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Sync site/ to the host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No build step: site/ is served as-is.
      - name: Sync files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ${{ vars.WEBSITE_URL }}${{ vars.FTP_REMOTE_DIR }}
          exclude: |
            **/README.md
