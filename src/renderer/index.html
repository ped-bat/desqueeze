<!DOCTYPE html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
		/>
		<title>Desqueeze app</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body class="min-h-screen p-8">
		<h1 class="text-3xl font-bold mb-6">Hello, Desqueeze!</h1>
		<div class="flex gap-5 mb-5">
			<div class="form-control w-28">
				<label class="label" for="ratio-x">
					<span class="label-text">Ratio X:</span>
				</label>
				<input
					type="number"
					id="ratio-x"
					value="1.33"
					step="0.01"
					min="0.01"
					class="input input-bordered w-full"
				/>
			</div>
			<div class="form-control w-28">
				<label class="label" for="ratio-y">
					<span class="label-text">Ratio Y:</span>
				</label>
				<input
					type="number"
					id="ratio-y"
					value="1"
					step="0.01"
					min="0.01"
					class="input input-bordered w-full"
				/>
			</div>
		</div>
		<button id="select-btn" class="btn btn-primary">
			Select Image & Desqueeze
		</button>
		<div id="metadata-display" class="mt-6"></div>
		<script type="module" src="./main.js"></script>
	</body>
</html>
