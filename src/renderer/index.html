<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'"
		/>
		<title>Desqueeze app</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body class="min-h-screen p-8 pt-14">
		<div class="titlebar-drag"></div>
		<h1 class="text-3xl font-bold mb-6">Desqueeze</h1>
		<div class="flex gap-5 mb-5">
			<div class="form-control w-28">
				<label class="label" for="ratio-x">
					<span class="label-text">Ratio X:</span>
				</label>
				<input
					type="number"
					id="ratio-x"
					value="1.33"
					step="0.01"
					min="0.01"
					class="input input-bordered w-full"
				/>
			</div>
			<div class="form-control w-28">
				<label class="label" for="ratio-y">
					<span class="label-text">Ratio Y:</span>
				</label>
				<input
					type="number"
					id="ratio-y"
					value="1"
					step="0.01"
					min="0.01"
					class="input input-bordered w-full"
				/>
			</div>
		</div>

		<!-- Output Format -->
		<div class="flex flex-wrap gap-5 mb-5 items-end">
			<div class="form-control w-40">
				<label class="label" for="output-format">
					<span class="label-text">Output format:</span>
				</label>
				<select id="output-format" class="select select-bordered w-full">
					<option value="dng" selected>DNG</option>
					<option value="jpg">JPEG</option>
					<option value="png">PNG</option>
					<option value="tiff">TIFF</option>
					<option value="webp">WebP</option>
				</select>
			</div>

			<!-- JPEG options -->
			<div id="opts-jpg" class="format-opts hidden flex gap-4 items-end">
				<div class="form-control w-40">
					<label class="label" for="jpg-quality">
						<span class="label-text">Quality: <span id="jpg-quality-val">95</span></span>
					</label>
					<input
						type="range"
						id="jpg-quality"
						min="1"
						max="100"
						value="95"
						class="range range-primary range-sm"
					/>
				</div>
			</div>

			<!-- PNG options -->
			<div id="opts-png" class="format-opts hidden flex gap-4 items-end">
				<div class="form-control w-48">
					<label class="label" for="png-compression">
						<span class="label-text">Compression: <span id="png-compression-val">2</span></span>
					</label>
					<input
						type="range"
						id="png-compression"
						min="0"
						max="9"
						value="2"
						class="range range-primary range-sm"
					/>
				</div>
			</div>

			<!-- TIFF options -->
			<div id="opts-tiff" class="format-opts hidden flex gap-4 items-end">
				<div class="form-control w-40">
					<label class="label" for="tiff-compression">
						<span class="label-text">Compression:</span>
					</label>
					<select id="tiff-compression" class="select select-bordered select-sm w-full">
						<option value="lzw" selected>LZW</option>
						<option value="deflate">Deflate</option>
						<option value="none">None</option>
					</select>
				</div>
			</div>

			<!-- WebP options -->
			<div id="opts-webp" class="format-opts hidden flex gap-4 items-end">
				<div class="form-control w-40">
					<label class="label" for="webp-quality">
						<span class="label-text">Quality: <span id="webp-quality-val">90</span></span>
					</label>
					<input
						type="range"
						id="webp-quality"
						min="1"
						max="100"
						value="90"
						class="range range-primary range-sm"
					/>
				</div>
				<div class="form-control">
					<label class="label cursor-pointer gap-2">
						<input type="checkbox" id="webp-lossless" class="toggle toggle-primary toggle-sm" />
						<span class="label-text">Lossless codec</span>
					</label>
				</div>
			</div>
		</div>
		<p id="format-hint" class="hidden text-xs opacity-50 mb-4 -mt-3">Non-DNG formats apply pixel resampling to bake the stretch into the image.</p>

		<div
			id="drop-zone"
			class="mt-4 border-2 border-dashed border-base-content/20 rounded-lg p-8 text-center cursor-pointer hover:border-primary hover:bg-base-200 transition-colors"
		>
			<div class="flex flex-col items-center gap-2">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					class="h-10 w-10 opacity-50"
					fill="none"
					viewBox="0 0 24 24"
					stroke="currentColor"
				>
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
						d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
					/>
				</svg>
				<p class="text-sm opacity-70">Drag & drop files here</p>
				<p class="text-xs opacity-50">or click to browse</p>
			</div>
		</div>
		<div class="form-control mt-4">
			<label class="label cursor-pointer justify-start gap-3">
				<input
					type="checkbox"
					id="sound-toggle"
					class="toggle toggle-primary"
					checked
				/>
				<span class="label-text">Play sounds</span>
			</label>
		</div>
		<div id="metadata-display" class="mt-6"></div>
		<script type="module" src="./main.js"></script>
	</body>
</html>
